# Local Postgres with pgvector for development: `npm run db:up`.
# Matches the DATABASE_URL in .env.example. Data lives in the named volume.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
