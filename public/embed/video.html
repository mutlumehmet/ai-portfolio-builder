<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Video</title>
<!-- A plain player for the page's embed block: a self-hosted MP4 with its poster and controls.
     Nothing plays until the reader presses play (a raw MP4 in an iframe can autoplay in Chrome).
     A big play button sits over the poster until the video starts, in the site's primary colour.
     Usage: /embed/video.html?src=/projects/<slug>/film.mp4&poster=/projects/<slug>/film.png -->
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #play {
    --size: clamp(56px, 14vw, 104px);
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: var(--size); height: var(--size); border-radius: 50%;
    background: var(--play-bg, #d97757); border: 4px solid #111; box-shadow: 6px 6px 0 #111;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  #play:hover { transform: translate(-50%, -50%) translate(-2px, -2px); box-shadow: 8px 8px 0 #111; }
  #play:active { transform: translate(-50%, -50%) translate(3px, 3px); box-shadow: 3px 3px 0 #111; }
  #play:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  #play svg { width: 42%; height: 42%; margin-left: 8%; fill: var(--play-fg, #fff); }
  #play[hidden] { display: none; }
</style>
</head>
<body>
<video id="v" controls playsinline preload="none"></video>
<button id="play" type="button" aria-label="Play video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5v17l15-8.5z"/></svg></button>
<script>
  // only this site's own project files
  const q = new URLSearchParams(location.search)
  const own = s => s && /^\/projects\/[a-z0-9-]+\/[\w.-]+$/.test(s)
  const v = document.getElementById('v')
  const play = document.getElementById('play')
  if (own(q.get('src'))) v.src = q.get('src')
  if (own(q.get('poster'))) v.poster = q.get('poster')

  // Take the button colours from the page that embeds the player (same site).
  try {
    const css = getComputedStyle(parent.document.documentElement)
    const bg = css.getPropertyValue('--primary').trim()
    const fg = css.getPropertyValue('--primary-foreground').trim()
    if (bg) document.documentElement.style.setProperty('--play-bg', bg)
    if (fg) document.documentElement.style.setProperty('--play-fg', fg)
  } catch {}

  play.addEventListener('click', () => v.play())
  v.addEventListener('play', () => { play.hidden = true })
  v.addEventListener('ended', () => { play.hidden = false })
</script>
</body>
</html>
